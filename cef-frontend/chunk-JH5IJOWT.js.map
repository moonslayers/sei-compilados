<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title">{{ nombre }}</h5>

    @if (tramiteDocumento) {
      <div class="alert alert-info d-flex justify-content-between align-items-center">
        <div>
          <small class="d-block text-muted">Documento actual:</small>
          <span>{{ tramiteDocumento.url_documento }}</span>
        </div>
        <button class="btn btn-outline-secondary btn-sm" (click)="verDocumento()">
          <i class="bi bi-eye"></i> Ver
        </button>
      </div>
      <p class="text-muted small">Si subes un nuevo documento, el actual será reemplazado.</p>
    }

    <div class="mb-3">
      <label class="form-label" for="documentoInput">Seleccionar documento</label>
      <input type="file" class="form-control" id="documentoInput" (change)="onFileSelected($event)" accept=".pdf">
    </div>

    <button class="btn btn-primary w-100" (click)="guardarDocumento({ url_documento: '' })" [disabled]="!file">
      Guardar documento
    </button>
  </div>
</div>
