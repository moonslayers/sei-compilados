<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-file-earmark-check fs-4 me-3"></i>
                        <div>
                            <h5 class="mb-0">Revisión de Solicitud</h5>
                            <small>Trámite: {{ tramite?.id }}</small>
                        </div>
                    </div>
                    <span class="badge" [ngClass]="getStatusBadgeClass(tramite?.status)">
                        {{ tramite?.status }}
                    </span>
                </div>

            </div>
            <div class="d-flex justify-content-end">
                <a routerLink="/main/tramites" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>
                    Volver
                </a>
            </div>
            @if (!loading && tramite) {

            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button [ngClass]="getTabClasses('info-general')" (click)="setActiveTab('info-general')"
                        type="button">
                        <i class="bi bi-info-circle me-2"></i>
                        Información trámite
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button [ngClass]="getTabClasses('documentos')" (click)="setActiveTab('documentos')" type="button">
                        <i class="bi bi-file-earmark me-2"></i>
                        Documentos
                    </button>
                </li>
            </ul>
            <div class="tab-content">
                @if (activeTab === 'info-general') {
                <app-info-general [tramite]="tramite"></app-info-general>
                }
                @if (activeTab === 'documentos') {
                <app-documentos-tramite [tramiteId]="tramite.id"></app-documentos-tramite>
                }
            </div>
            }
        </div>
    </div>
</div>
