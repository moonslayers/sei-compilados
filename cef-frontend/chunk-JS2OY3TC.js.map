@if (this.tramite) {
  <div class="mb-4">
  <div class="card border-primary">
    <div class="card-header bg-primary text-white">
      <div class="d-flex align-items-center">
        <i class="bi bi-building-fill-check me-2"></i>
        <h4 class="mb-0">Sección 1: Empresa Solicitante</h4>
      </div>
    </div>
    <div class="card-body">
      <app-empresa-form [empresaId]="tramite.empresa_id" (saved)="empresaGuardada($event)"></app-empresa-form>
    </div>
  </div>
</div>

<div class="mb-4">
  <div class="card border-primary">
    <div class="card-header bg-primary text-white">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <i class="bi bi-link-45deg me-2"></i>
          <h4 class="mb-0">Sección 2: Empresa Vinculada (Opcional)</h4>
        </div>
        <button class="btn btn-outline-light btn-sm" 
                (click)="toggleSeccionVinculada()" 
                (keyup.enter)="toggleSeccionVinculada()"
                aria-expanded="{{ showAgregarEmpresaVinculada }}"
                aria-label="Toggle sección empresa vinculada">
          <i [class]="'bi bi-chevron-' + (showAgregarEmpresaVinculada ? 'up' : 'down')"></i>
        </button>
      </div>
    </div>
    @if (showAgregarEmpresaVinculada) {
      <div class="card-body">
        
        <div class="card border-secondary mb-3">
          <div class="card-header bg-secondary text-white">
            <div class="d-flex align-items-center">
              <i class="bi bi-building me-2"></i>
              <h5 class="mb-0">2.1: Datos de la Empresa Vinculada</h5>
            </div>
          </div>
          <div class="card-body">
            <app-empresa-form [empresaId]="tramite.empresa_vinculada_id" (saved)="empresaVinculadaGuardada($event)"></app-empresa-form>
          </div>
        </div>

        <div class="card border-secondary">
          <div class="card-header bg-secondary text-white">
            <div class="d-flex align-items-center">
              <i class="bi bi-people me-2"></i>
              <h5 class="mb-0">2.2: Datos de Vinculación</h5>
            </div>
          </div>
          <div class="card-body">
            <div class="row mb-4">
              <div class="col-lg-6">
                <label for="empresaBeneficiada" class="form-label fw-semibold">Empresa Beneficiada <span class="text-danger">*</span></label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-light"><i class="bi bi-building-check text-muted"></i></span>
                  <select id="empresaBeneficiada" class="form-select" (change)="onEmpresaBeneficiadaChange($event)">
                    <option [value]="tramite.empresa_id" [selected]="empresaBeneficiadaId === tramite.empresa_id">
                      {{ tramite.empresa?.nombre_solicitante || 'Empresa Solicitante' }}
                    </option>
                    @if (tramite.empresa_vinculada_id) {
                      <option [value]="tramite.empresa_vinculada_id" [selected]="empresaBeneficiadaId === tramite.empresa_vinculada_id">
                        {{ tramite.empresa_vinculada?.nombre_solicitante || 'Empresa Vinculada' }}
                      </option>
                    }
                  </select>
                </div>
                <small class="text-muted">Seleccione cuál empresa será la beneficiada de la vinculación</small>
              </div>
            </div>
            
            <app-empresa-vinculada-form [tramiteId]="tramite.id" [empresaSolicitanteId]="empresaBeneficiadaId"></app-empresa-vinculada-form>
          </div>
        </div>
        
      </div>
    }
  </div>
</div>
}
