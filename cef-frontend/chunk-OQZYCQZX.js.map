<div class="container-fluid">
  <app-tabla
    [controller]="empresasService"
    [tableDefinition]="tableDefinition"
    [title]="'Empresas'"
    [agregar]="false"
    [showBarraButtons]="true"
    [barraBusqueda]="true"
    [isDetailed]="true"
    [detailedDefinition]="detailedDefinition"
    [advancedSearch]="advancedSearch"         
    [showAdvancedButton]="true"
    [paginador]="{ page: 1, per_page: 20 }"
    [checkbox]="false"
    [rowEditar]="false"
    [rowEliminar]="false"
    [eliminar]="false"
    [restaurar]="false"
    [activos]="true"
    [eliminados]="true">
  </app-tabla>
</div>
