<div class="container-fluid">
  <app-tabla
    [controller]="tramiteDocumentoService"
    [tableDefinition]="tableDefinition"
    [title]="'Documentos del Trámite'"
    [agregar]="false"
    [showBarraButtons]="false"
    [barraBusqueda]="false"
    [rowButtons]="rowButtons"
    [paginador]="{ page: 1, per_page: 10 }"
    [checkbox]="false"
    [rowEditar]="false"
    [rowEliminar]="false"
    [eliminar]="false"
    [restaurar]="false"
    [activos]="false"
    [eliminados]="false"
    [getConditionals]="getConditionals"
    (rowButtonClickEvent)="onRowButtonClick($event)">
  </app-tabla>
</div>
