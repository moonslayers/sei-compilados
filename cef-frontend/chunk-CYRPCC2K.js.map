<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-file-earmark-check fs-4 me-3"></i>
                        <div>
                            <h5 class="mb-0">Revisión de Solicitud</h5>
                            <small>Trámite: {{ tramite?.id }}</small>
                        </div>
                    </div>
                    <span class="badge" [ngClass]="getStatusBadgeClass(tramite?.status)">
                        {{ tramite?.status }}
                    </span>
                </div>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <a routerLink="/main/tramites" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>
                    Volver
                </a>
            </div>

            @if (!loading && tramite) {
            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button [ngClass]="getTabClasses('info-general')" (click)="setActiveTab('info-general')"
                        type="button">
                        <i class="bi bi-info-circle me-2"></i>
                        Información trámite
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button [ngClass]="getTabClasses('documentos')" (click)="setActiveTab('documentos')" type="button">
                        <i class="bi bi-file-earmark me-2"></i>
                        Documentos
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button [ngClass]="getTabClasses('anexos')" (click)="setActiveTab('anexos')" type="button">
                        <i class="bi bi-card-list me-2"></i>
                        Anexos
                    </button>
                </li>
            </ul>

            <div class="row g-3 mb-4">
                <div class="col-md-6 col-lg-8">
                    <div class="tab-content">
                        @if (activeTab === 'info-general') {
                        <app-info-general [tramite]="tramite"></app-info-general>
                        }
                        @if (activeTab === 'documentos') {
                        <app-documentos-tramite [tramiteId]="tramite.id"></app-documentos-tramite>
                        }
                        @if (activeTab === 'anexos') {
                        <app-tramite-anexos [tramite]="tramite"></app-tramite-anexos>
                        }
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <app-tramite-comentarios [tramiteId]="tramite.id"></app-tramite-comentarios>
                    <app-tramites-acciones [(tramite)]="tramite"></app-tramites-acciones>
                </div>
            </div>
            }
        </div>
    </div>
</div>
