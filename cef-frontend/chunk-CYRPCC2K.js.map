<div class="card mt-3 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="card-title mb-0">
            <i class="bi bi-lightning-fill me-2"></i>
            Acciones
        </h5>
    </div>
    <div class="card-body">
        <div class="d-grid gap-3">
            <button class="btn btn-outline-primary d-flex align-items-center justify-content-start" (click)="cambiarStatus('RECIBIDA')">
                <i class="bi bi-inbox me-3 fs-5"></i>
                <div class="text-start">
                    <strong>Recibir trámite</strong>
                    <div class="small text-muted">Marcar como recibida</div>
                </div>
            </button>
            <button class="btn btn-outline-info d-flex align-items-center justify-content-start" (click)="cambiarStatus('EN_REVISION')">
                <i class="bi bi-search me-3 fs-5"></i>
                <div class="text-start">
                    <strong>Poner en revisión</strong>
                    <div class="small text-muted">Enviar a revisión</div>
                </div>
            </button>
            <button class="btn btn-outline-success d-flex align-items-center justify-content-start" (click)="cambiarStatus('VALIDADA')">
                <i class="bi bi-check-all me-3 fs-5"></i>
                <div class="text-start">
                    <strong>Validar trámite</strong>
                    <div class="small text-muted">Marcar como validada</div>
                </div>
            </button>
            <button class="btn btn-outline-danger d-flex align-items-center justify-content-start" (click)="cambiarStatus('CANCELADA')">
                <i class="bi bi-x-circle me-3 fs-5"></i>
                <div class="text-start">
                    <strong>Cancelar trámite</strong>
                    <div class="small text-muted">Marcar como cancelada</div>
                </div>
            </button>
        </div>
    </div>
</div>
