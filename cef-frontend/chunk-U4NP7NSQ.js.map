<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
  @if (loading) {
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  } @else {
    <div class="row justify-content-center w-100">
      <div class="col-12 text-center">
        <i class="bi bi-person-circle h1 p-3"></i>
        <h1 class="display-5 fw-bold mb-3">Seleccionar Trámite</h1>
        <p class="lead text-muted">Elija el tipo de trámite que desea realizar</p>
      </div>

      @if (yaTieneTramite) {
        <div class="col-12">
          <div class="alert alert-info d-flex align-items-center justify-content-center" role="alert">
            <i class="bi bi-info-circle-fill me-3 fs-4"></i>
            <div>
              <strong>Usted ya tiene un trámite en proceso.</strong><br>
            </div>
          </div>
        </div>
      }

      <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
        <button
          type="button"
          class="tramite-card w-100 h-100 d-flex flex-column align-items-center justify-content-center p-5"
          [disabled]="yaTieneTramite"
          (click)="crearTramite('inversion_privada')">
          <i class="bi bi-cash-coin mb-4 fs-1"></i>
          <h3 class="fw-bold mb-3 text-center">Ingreso sobre Nómina</h3>
          @if (yaTieneTramite) {
            <span class="badge bg-secondary mt-auto">
              <i class="bi bi-lock-fill me-1"></i>
              No disponible
            </span>
          } @else {
            <span class="btn btn-primary btn-lg mt-auto">
              Seleccionar
              <i class="bi bi-arrow-right ms-2"></i>
            </span>
          }
        </button>
      </div>

      <div class="col-lg-5 col-md-6">
        <button
          type="button"
          class="tramite-card w-100 h-100 d-flex flex-column align-items-center justify-content-center p-5"
          [disabled]="yaTieneTramite"
          (click)="crearTramite('tratamiento_agua')">
          <i class="bi bi-droplet-half mb-4 fs-1"></i>
          <h3 class="fw-bold mb-3 text-center">Sistemas de tratamiento de aguas residuales</h3>
          @if (yaTieneTramite) {
            <span class="badge bg-secondary mt-auto">
              <i class="bi bi-lock-fill me-1"></i>
              No disponible
            </span>
          } @else {
            <span class="btn btn-primary btn-lg mt-auto">
              Seleccionar
              <i class="bi bi-arrow-right ms-2"></i>
            </span>
          }
        </button>
      </div>
    </div>
  }
</div>
