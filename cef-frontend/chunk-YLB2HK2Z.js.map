<div class="container-fluid h-100">
  <div class="row justify-content-center align-items-center h-100">
    <div class="col-12 col-lg-8 col-xl-6">
      <h1 class="display-4 fw-bold text-primary">Bienvenido</h1>
      <p class="lead text-muted fs-5">Seleccione el tipo de trámite que desea realizar</p>

      <div class="row g-4">
        <div class="col-12 col-md-6">
          <div class="card h-100 border-0 shadow-lg clickable-card p-5 text-center"
               role="button"
               aria-label="Seleccionar tipo de trámite: Ingreso sobre Nómina"
               tabindex="0"
               (click)="seleccionarTipoTramite('estimulo_nomina')"
               (keyup.enter)="seleccionarTipoTramite('estimulo_nomina')">
            <i class="bi bi-cash-coin text-primary bi-icon-tramite"></i>
            <h3 class="card-title fw-bold mt-3">Ingreso sobre Nómina</h3>
            <p class="card-text text-muted">Solicitar estímulo fiscal sobre la nómina en inversión privada</p>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="card h-100 border-0 shadow-lg clickable-card p-5 text-center"
               role="button"
               aria-label="Seleccionar tipo de trámite: Sistemas de Tratamiento de Aguas"
               tabindex="0"
               (click)="seleccionarTipoTramite('estimulo_tratamiento_aguas')"
               (keyup.enter)="seleccionarTipoTramite('estimulo_tratamiento_aguas')">
            <i class="bi bi-droplet text-primary bi-icon-tramite"></i>
            <h3 class="card-title fw-bold mt-3">Sistemas de Tratamiento de Aguas</h3>
            <p class="card-text text-muted">Solicitar estímulo fiscal sobre sistemas de tratamiento de aguas</p>
          </div>
        </div>
      </div>

      <div class="text-center mt-5">
        <small class="text-muted">
          <i class="bi bi-info-circle"></i> Seleccione una opción para comenzar su trámite
        </small>
      </div>
    </div>
  </div>
</div>
