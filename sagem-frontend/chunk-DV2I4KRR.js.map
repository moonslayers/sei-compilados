<div class="container-fluid p-0">
    <!-- Header principal con pestañas -->
    <div class="bg-white border-bottom sticky-top shadow-sm" style="z-index: 1000;">
        <div class="container-fluid p-4">
            <!-- Título principal -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-people text-primary me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="h3 mb-1">Usuarios</h1>
                            <p class="text-muted mb-0">{{ getPestanaActivaInfo()?.descripcion }}</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navegación de pestañas -->
            <div class="row">
                <div class="col-12">
                    <nav class="nav nav-tabs nav-tabs-custom border-0" role="tablist">
                        @for (tab of tabs; track tab.id) {
                            <button
                                class="nav-link nav-link-custom"
                                [class.active]="isActive(tab.id)"
                                (click)="cambiarPestana(tab.id)"
                                type="button"
                                role="tab"
                                [attr.aria-selected]="isActive(tab.id)"
                                [attr.aria-controls]="`tab-${tab.id}`">
                                <i class="bi {{ tab.icono }} me-2"></i>
                                {{ tab.label }}
                            </button>
                        }
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenido de las pestañas -->
    <div class="tab-content" style="min-height: calc(100vh - 180px);">
        <!-- Panel de Internos -->
        @if (isActive('internos')) {
            <div
                class="tab-pane fade show active"
                id="tab-internos"
                role="tabpanel"
                tabindex="0">
                <app-tabla title="Usuarios Internos" [controller]="usuarioController" [tableDefinition]="table" [relations]="relations" [getConditionals]="internosConditionals"></app-tabla>
            </div>
        }

        <!-- Panel de Externos -->
        @if (isActive('externos')) {
            <div
                class="tab-pane fade show active"
                id="tab-externos"
                role="tabpanel"
                tabindex="0">

                <!-- Botones para Activos/Inactivos -->
                <div class="px-4 pt-4">
                    <div class="btn-group" role="group" aria-label="Filtro de usuarios externos">
                        <button 
                            type="button" 
                            class="btn"
                            [class.btn-primary]="isExternosViewActive('activos')"
                            [class.btn-outline-primary]="!isExternosViewActive('activos')"
                            (click)="setExternosView('activos')">
                            Activos
                        </button>
                        <button 
                            type="button" 
                            class="btn"
                            [class.btn-primary]="isExternosViewActive('inactivos')"
                            [class.btn-outline-primary]="!isExternosViewActive('inactivos')"
                            (click)="setExternosView('inactivos')">
                            Inactivos
                        </button>
                    </div>
                </div>

                @if (isExternosViewActive('activos')) {
                    <app-tabla 
                        title="Usuarios Externos Activos" 
                        [controller]="usuarioController" 
                        [tableDefinition]="table" 
                        [relations]="relations" 
                        [getConditionals]="externosActivosConditionals"                        
                        [rowEditar]="!isUsuarioInterno">
                    </app-tabla>
                }

                @if (isExternosViewActive('inactivos')) {
                    <app-tabla 
                        title="Usuarios Externos Inactivos" 
                        [controller]="usuarioController" 
                        [tableDefinition]="table" 
                        [relations]="relations" 
                        [getConditionals]="externosInactivosConditionals"
                        [getAdvancedFilters]="externosInactivosAdvancedFilters"
                        [rowEditar]="!isUsuarioInterno">
                    </app-tabla>
                }
            </div>
        }
    </div>
</div>
