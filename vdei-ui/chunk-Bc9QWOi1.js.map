<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
  <nav aria-label="Paginación">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="isFirstPage()">
        <button
          type="button"
          class="page-link"
          [attr.aria-disabled]="isFirstPage()"
          (click)="previous()"
        >
          Anterior
        </button>
      </li>

      @for (item of pageItems(); track $index) {
        @if (item === 'ellipsis') {
          <li class="page-item disabled">
            <span class="page-link">…</span>
          </li>
        } @else {
          <li class="page-item" [class.active]="item === safeCurrentPage()">
            <button
              type="button"
              class="page-link"
              (click)="goToPage(item)"
            >
              {{ item }}
            </button>
          </li>
        }
      }

      <li class="page-item" [class.disabled]="isLastPage()">
        <button
          type="button"
          class="page-link"
          [attr.aria-disabled]="isLastPage()"
          (click)="next()"
        >
          Siguiente
        </button>
      </li>
    </ul>
  </nav>

  <div class="d-flex align-items-center gap-2">
    <span class="text-muted small">{{ rangeText() }}</span>
    <select
      class="form-select form-select-sm"
      style="width: auto"
      [value]="perPage()"
      (change)="onPageSizeChange($event)"
    >
      @for (size of pageSizeOptions(); track size) {
        <option [value]="size" [selected]="size === perPage()">{{ size }}</option>
      }
    </select>
  </div>
</div>
