<div class="dropdown">
  <button class="btn btn-secondary dropdown-toggle" type="button" (click)="toggleDropdown()">
    {{ selectedDireccion ? selectedDireccion.nombre : 'Seleccionar una dirección' }}
  </button>
  <ul class="dropdown-menu" [class.show]="isDropdownOpen">
    @for (node of direcciones; track node) {
      @if (!node.hijos || node.hijos.length === 0) {
        <li>
          <a (click)="seleccionarDireccion(node)" (keydown.enter)="seleccionarDireccion(node)" (keydown.space)="seleccionarDireccion(node)" role="button" tabindex="0" class="dropdown-item selectable">
            {{ node.id }}.- {{ node.nombre }}
          </a>
        </li>
      } @else {
        <li>
          <h6 class="dropdown-header">{{ node.id }}.- {{ node.nombre }}</h6>
          <ul class="list-unstyled">
            @for (hijo of node.hijos; track hijo) {
              <li>
                <a (click)="seleccionarDireccion(hijo)" (keydown.enter)="seleccionarDireccion(hijo)" (keydown.space)="seleccionarDireccion(hijo)" role="button" tabindex="0" class="dropdown-item selectable">
                  {{ hijo.id }}.- {{ hijo.nombre }}
                </a>
              </li>
            }
          </ul>
        </li>
      }
    }
  </ul>
</div>
