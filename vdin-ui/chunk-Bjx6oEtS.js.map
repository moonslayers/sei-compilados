<div class="tramite-section mb-4 p-3 border rounded">
  <h4 class="fw-bold mb-2 text-truncate" [title]="tramite().nombre">{{ tramite().nombre }}</h4>
  @if (tramite().descripcion) {
    <p class="text-secondary small mb-3 text-truncate" [title]="tramite().descripcion">{{ tramite().descripcion }}</p>
  }
  @for (requisito of tramite().requisitos; track requisito.id) {
    <div class="mb-3">
      <label class="form-label d-block text-truncate mb-2" [attr.for]="'file-' + getClave(requisito) + '-input'" [title]="requisito.nombre + (requisito.alias ? ' (' + requisito.alias + ')' : '')">
        @if (requisito.es_obligatorio) {
          <span class="required-asterisk">*</span>
        }
        {{ requisito.nombre }}
        @if (requisito.alias) {
          <span class="text-muted ms-1">({{ requisito.alias }})</span>
        }
      </label>
      <app-document-uploader
        [id]="'file-' + getClave(requisito)"
        [label]="requisito.nombre"
        [file]="getFile(getClave(requisito))"
        (fileChange)="onFileChange(getClave(requisito), $event)"
        [documentId]="getDocumentId(getClave(requisito))"
        (documentIdChange)="onIdChange(getClave(requisito), $event)"
        [required]="!!requisito.es_obligatorio"
        (view)="onViewFile($event, requisito.nombre, getDocumentId(getClave(requisito)))">
      </app-document-uploader>
    </div>
  }
</div>
