<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-primary">{{ isEditMode ? 'Editar' : 'Nuevo' }} Reporte Trimestral</h1>
    <a routerLink="/inversores/reportes" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-2"></i>Volver
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label for="solicitud_id" class="form-label fw-bold">Solicitud Asociada <span class="text-danger">*</span></label>
          <select id="solicitud_id" class="form-select" formControlName="solicitud_id" [class.is-invalid]="form.get('solicitud_id')?.invalid && form.get('solicitud_id')?.touched">
            <option value="" disabled>Seleccione una solicitud...</option>
            @for (sol of solicitudesAprobadas(); track sol.id) {
              <option [value]="sol.id">
                {{ sol.folio }} - {{ sol.proyecto || sol.solicitante }}
              </option>
            }
          </select>
          <div class="invalid-feedback">Debe seleccionar una solicitud válida.</div>
        </div>

        <div class="mb-3">
          <label for="titulo" class="form-label fw-bold">Título del Reporte <span class="text-danger">*</span></label>
          <input type="text" id="titulo" class="form-control" formControlName="titulo" [class.is-invalid]="form.get('titulo')?.invalid && form.get('titulo')?.touched" placeholder="Ej. Reporte de Avance Fase 1">
          <div class="invalid-feedback">El título es requerido y no debe exceder 255 caracteres.</div>
        </div>

        <div class="mb-4">
          <label for="contenido" class="form-label fw-bold">Contenido del Reporte <span class="text-danger">*</span></label>
          <quill-editor 
            id="contenido"
            formControlName="contenido"
            [styles]="{height: '300px'}"
            placeholder="Redacte el reporte trimestral aquí...">
          </quill-editor>
          @if (form.get('contenido')?.invalid && form.get('contenido')?.touched) {
            <div class="text-danger small mt-1">
              El contenido es requerido.
            </div>
          }
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a routerLink="/inversores/reportes" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">
            <i class="bi bi-save me-2"></i>{{ isSubmitting ? 'Guardando...' : 'Guardar Reporte' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
