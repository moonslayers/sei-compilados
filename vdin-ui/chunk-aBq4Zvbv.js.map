<div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="obsModalTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="obsModalTitle">{{ esEdicion() ? 'Editar observación' : 'Agregar observación' }}</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCerrar()"></button>
      </div>
      <div class="modal-body">
        @if (targetLabel()) {
        <p class="text-body-secondary small mb-3">
          <i class="bi bi-geo-alt me-1"></i>{{ targetLabel() }}
        </p>
        }
          <div class="mb-3">
            <label class="form-label fw-semibold" for="obs-texto">Observación</label>
            <textarea id="obs-texto" class="form-control" rows="4" [value]="texto()"
              (input)="onTexto($event)"
              placeholder="Describe la observación o corrección requerida"></textarea>
          </div>
       </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="onCerrar()">Cancelar</button>
        <button type="button" class="btn btn-primary" [disabled]="!esValido()" (click)="onGuardar()">
          <i class="bi" [class.bi-plus-lg]="!esEdicion()" [class.bi-check-lg]="esEdicion()"></i>{{ esEdicion() ? 'Guardar cambios' : 'Agregar observación' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop show"></div>
