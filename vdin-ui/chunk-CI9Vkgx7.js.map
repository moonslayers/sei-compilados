<div class="lmx-wrapper">
  <div class="lmx-page">
    <div class="lmx-left">
      <div class="lmx-left__content">
        <h1 class="lmx-left__title">Ventanilla Digital<br />Estatal de Inversiones</h1>
        <div class="lmx-inst-card">
          <img ngSrc="BC_imagotipo.png" width="240" height="70" alt="Gobierno del Estado de Baja California" priority />
        </div>
      </div>
    </div>
    <div class="lmx-right">
      <div class="lmx-card">
        <img ngSrc="llaveMX.png" width="138" height="56" alt="Llave MX" class="lmx-card__logo" priority />

        @if (errorMessage()) {
          <div class="alert alert-danger small py-2 mb-3 w-100" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <p class="lmx-card__terminos">
          Al iniciar sesión declaro que he leído los
          <a href="https://www.archivos.atdt.gob.mx/storage/app/media/Transparencia/TyC/TerminosLlaveMX.pdf" target="_blank" rel="noopener noreferrer">Términos y Condiciones</a>
          y nuestro
          <a href="https://www.archivos.atdt.gob.mx/storage/app/media/Transparencia/PORTAL%20ATDT/AVISOS%20DE%20PRIVACIDAD/ATDT_Aviso%20de%20Privacidad%20Integral%20Llave%20MX.pdf" target="_blank" rel="noopener noreferrer">Aviso de Privacidad</a>.
        </p>

        <div class="lmx-btns">
          <button
            type="button"
            class="lmx-btn-outline"
            data-testid="llave-mx-register"
            (click)="onCrearCuenta()"
          >
            Crear cuenta
          </button>
          <button
            type="button"
            class="lmx-btn-solid"
            data-testid="llave-mx-login"
            (click)="onLlaveMxLogin()"
          >
            Iniciar sesión
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
