<div class="tramite-progress-container">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
    <div class="d-flex align-items-center flex-wrap gap-2 min-w-0">
      <span class="progress-title fw-semibold">{{ label() }}</span>
      @if (isComplete()) {
        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">
          <i class="bi bi-check-circle-fill me-1" aria-hidden="true"></i>Completado
        </span>
      }
    </div>
    <div class="d-flex align-items-center flex-wrap gap-2 flex-shrink-0 ms-auto">
      @if (showCount() && effectiveTotal() > 0) {
        <span class="text-secondary progress-count">
          {{ completed() }} de {{ effectiveTotal() }} obligatorios
        </span>
      }
      @if (showPercentage()) {
        <span
          class="badge rounded-pill fw-bold"
          [class.bg-primary]="!isComplete()"
          [class.bg-success]="isComplete()"
        >
          {{ percentage() }}%
        </span>
      }
    </div>
  </div>

  <div
    class="progress"
    role="progressbar"
    [attr.aria-valuenow]="percentage()"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="label()"
  >
    <div
      class="progress-bar progress-bar-striped progress-bar-animated"
      [class.bg-success]="isComplete()"
      [class.bg-primary]="!isComplete()"
      [style.width.%]="percentage()"
    ></div>
  </div>
</div>
