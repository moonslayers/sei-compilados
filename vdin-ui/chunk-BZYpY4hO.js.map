<div class="container h-100 position-relative d-flex flex-column justify-content-between py-4" style="z-index: 1;">
  <div class="d-flex align-items-start justify-content-center">
    <button class="decreto-card bg-white rounded-3 border-0 d-flex align-items-center gap-2 gap-md-3 p-3 w-100 w-md-auto"
      (click)="toDecreto()">
      <img [ngSrc]="'decreto.png'" alt="Decreto" class="decreto-imagen" height="160" width="150" priority />
      <div class="decreto-spacer"></div>
      <span class="fs-6 fs-md-5 text-dark flex-grow-1 text-start" style="line-height: 1.3;">Decreto de
        autorización inmediata |
        Agiliza tu proyecto de inversión</span>
      <span class="fs-1 text-primary fw-bold flex-shrink-0 ms-auto ms-md-0" aria-hidden="true">›</span>
    </button>
  </div>
  <div class="marquee-container w-100 overflow-hidden position-relative mt-4">
    <div class="marquee-content d-flex align-items-center">
      @for (m of municipios; track m.name + '-1') {
        <div class="marquee-item">
          <img [ngSrc]="m.logo" [alt]="m.name" height="70" width="150" class="municipio-logo" style="object-fit: contain;" />
        </div>
      }
      @for (m of municipios; track m.name + '-2') {
        <div class="marquee-item" aria-hidden="true">
          <img [ngSrc]="m.logo" [alt]="m.name" height="70" width="150" class="municipio-logo" style="object-fit: contain;" />
        </div>
      }
    </div>
  </div>
</div>
