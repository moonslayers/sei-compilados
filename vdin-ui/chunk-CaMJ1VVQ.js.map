<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Catálogo de Trámites</h1>
    <button type="button" class="btn btn-primary" (click)="onNuevo()">Nuevo trámite</button>
  </div>

  <div class="row mb-3">
    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Buscar por nombre..."
        [value]="searchTerm()"
        (input)="onSearch($event)"
        aria-label="Buscar trámites"
      />
    </div>
    <div class="col-md-8 d-flex gap-2 justify-content-end">
      <button
        type="button"
        class="btn btn-sm"
        [class]="sortBy() === 'nombre' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="onSort('nombre')"
      >
        Nombre{{ sortIcon('nombre') }}
      </button>
      <button
        type="button"
        class="btn btn-sm"
        [class]="sortBy() === 'created_at' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="onSort('created_at')"
      >
        Fecha{{ sortIcon('created_at') }}
      </button>
      <button
        type="button"
        class="btn btn-sm"
        [class]="sortBy() === 'nivel_gobierno' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="onSort('nivel_gobierno')"
      >
        Nivel{{ sortIcon('nivel_gobierno') }}
      </button>
      <button
        type="button"
        class="btn btn-sm"
        [class]="sortBy() === 'vigencia_dias' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="onSort('vigencia_dias')"
      >
        Vigencia{{ sortIcon('vigencia_dias') }}
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  } @else if (tramites().length === 0) {
    <div class="text-center py-5 text-secondary">
      No se encontraron trámites.
    </div>
  } @else {
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mb-4">
      @for (t of tramites(); track t.id) {
        <div class="col">
          <app-tramite-card
            [tramite]="t"
            (editar)="onEditar($event)"
            (eliminar)="onEliminar($event)"
          />
        </div>
      }
    </div>

    <app-paginator
      [currentPage]="page()"
      [lastPage]="lastPage()"
      [total]="total()"
      [perPage]="perPage()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  }
</div>
