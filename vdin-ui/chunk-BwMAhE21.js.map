<app-institutional-bar />
<app-main-navbar />

<section class="como-funciona-page">
  <div class="como-funciona-hero">
    <div class="container position-relative h-100 d-flex align-items-center justify-content-center">
      <h1 class="como-funciona-title text-center fw-bold text-white mb-0">
        ¿Cómo funciona?
      </h1>
    </div>
  </div>

  <div class="como-funciona-video-shell px-3 px-md-0">
    <div class="container position-relative">
      <article class="video-player-card mx-auto shadow-lg">
        <div class="video-player-card__frame">
          <iframe
            class="video-player-card__iframe"
            [src]="videoEmbedUrl"
            title="Ventanilla Digital Estatal de Inversiones"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </article>
    </div>
  </div>
</section>

<app-footer-section />
