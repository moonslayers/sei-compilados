<nav class="navbar navbar-dark navbar-primary-dark py-0" style="height: 48px;">
  <div class="container d-flex align-items-center justify-content-between h-100">
    <ul class="nav align-items-center gap-4 mb-0">
      @for (item of navItems; track item.label) {
        <li class="nav-item">
          <a
            class="nav-link text-white px-0 small fw-bold"
            style="line-height: 48px;"
            [class.active]="item.active"
            [routerLink]="item.route"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
    <div class="d-flex align-items-center gap-3">
      @if (authService.currentUser(); as user) {
        <span class="text-white small fw-semibold">Hola, {{ user.name }}</span>
        <button 
          (click)="onLogoutClick($event)" 
          class="btn btn-link text-white px-0 py-0 small fw-bold text-decoration-none" 
          style="line-height: 48px;"
        >
          Cerrar sesión
        </button>
      } @else {
        <a
          routerLink="/login"
          class="nav-link text-white px-0 py-0 small fw-bold text-decoration-none d-inline-block"
          style="line-height: 48px;"
        >
          Inicia sesión
        </a>
      }
      @if (llaveMxEnabled) {
        <a
          href="#"
          class="d-flex align-items-center gap-1 text-decoration-none"
          data-testid="navbar-llave-mx-login"
          (click)="onLlaveMxLogin(); $event.preventDefault()"
        >
          <img
            ngSrc="llave-logo.png"
            alt="Iniciar sesión con Llave MX"
            height="20"
            width="30"
            class="d-block"
            style="object-fit: contain;"
          />
          <span class="text-white small fw-semibold" style="font-size: 12px;">Llave MX</span>
        </a>
      }
    </div>
  </div>
</nav>
