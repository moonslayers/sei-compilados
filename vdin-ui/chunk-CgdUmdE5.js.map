<div class="d-flex flex-column gap-1">
  @if (label()) {
    <label class="form-label fw-semibold" for="chip-input-field">{{ label() }}</label>
  }
  <div
    class="chip-container d-flex flex-wrap gap-1 border rounded-3 p-2"
    role="list"
    [attr.aria-label]="label() || 'Etiquetas'"
  >
    @for (chip of items(); track chip; let i = $index) {
      <span
        class="badge bg-secondary d-inline-flex align-items-center gap-1"
        role="listitem"
        [attr.aria-label]="chip + ', presione eliminar'"
      >
        {{ chip }}
        <button
          type="button"
          class="btn-close btn-close-white"
          style="font-size: 0.65em"
          (click)="removeChip(i)"
          [attr.aria-label]="'Eliminar ' + chip"
        ></button>
      </span>
    }
    <input
      id="chip-input-field"
      type="text"
      class="form-control form-control-sm border-0 p-0 flex-grow-1"
      style="min-width: 120px; box-shadow: none"
      [placeholder]="placeholder()"
      [value]="inputValue()"
      (input)="onInput($event)"
      (keydown)="addChip($event)"
      (keydown.backspace)="onKeydown($event)"
      [attr.aria-describedby]="label() ? 'chip-input-help' : null"
    />
  </div>
  @if (label()) {
    <small id="chip-input-help" class="text-secondary">Presione Enter para agregar una etiqueta.</small>
  }
</div>
