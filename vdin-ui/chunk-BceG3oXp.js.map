<header class="topbar d-flex bg-primary align-items-center justify-content-between px-2 px-md-3 border-0 py-2">
  <div class="d-flex align-items-center gap-1 gap-md-2">
    <app-brand />
    <div class="vr mx-3"></div>
    <button class="topbar-btn btn rounded p-2" (click)="sidebarService.toggle()" aria-label="Alternar menú">
      <i class="bi-list fs-5"></i>
    </button>
  </div>

  <div class="d-flex align-items-center gap-2">
    <button class="topbar-btn btn rounded px-3 py-2" (click)="themeService.toggleTheme()"
      [attr.aria-label]="'Cambiar tema'">
      <i [class]="themeService.themeIcon()" class="fs-5"></i>
    </button>

      <a class="topbar-btn btn rounded px-3 py-2 d-flex align-items-center gap-2 text-decoration-none"
        [routerLink]="perfilRoute()" routerLinkActive="active">
        <i class="bi bi-person-circle fs-4"></i>
        @if (authService.currentUser(); as user) {
        <div class="d-none d-md-flex flex-column lh-sm">
          <span class="fw-semibold small">{{ user.name }}</span>
          <span class="small text-white-50">{{ roleLabel(user.role) }}</span>
        </div>
        }
      </a>
  </div>
</header>
