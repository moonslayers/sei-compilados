<div class="card">
  @if (loading()) {
    <div class="card-body text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando documento...</span>
      </div>
      <p class="mt-2 text-muted">Cargando documento...</p>
    </div>
  } @else if (error()) {
    <div class="card-body text-center py-5">
      <div class="alert alert-danger mb-0">
        <i class="bi bi-exclamation-triangle fs-3 d-block mb-2"></i>
        <p class="mb-1">No se pudo cargar el documento PDF.</p>
        <button type="button" class="btn btn-outline-danger btn-sm mt-2" (click)="ngOnInit()">Volver a cargar</button>
      </div>
    </div>
  } @else if (blobUrl(); as src) {
    <div class="card-body p-0">
      <iframe
        [src]="src"
        class="w-100"
        style="min-height: 70vh; border: 0"
        title="Visor de PDF"
      ></iframe>
    </div>
  } @else {
    <div class="card-body">
      <div class="alert alert-secondary mb-0">
        Sin documento
      </div>
    </div>
  }
</div>
