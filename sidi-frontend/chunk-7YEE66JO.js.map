<div class="dropdown">
  <input
    type="text"
    class="form-control dropdown-toggle"
    [placeholder]="placeholder"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchTermChange()"
    (focus)="toggleDropdown()"
    data-bs-toggle="dropdown" aria-expanded="false"
  />
  @if (isDropdownOpen) {
    <ul class="dropdown-menu show w-100" style="max-height: 200px; overflow-y: auto;">
      @for (option of filteredOptions; track option) {
        <li><a class="dropdown-item text-truncate" [title]="option" (click)="selectOption(option)" (keydown)="onKeyDown($event, option)" tabindex="0">{{ option }}</a></li>
      }
      @if (filteredOptions.length === 0) {
        <li><span class="dropdown-item-text text-muted">No se encontraron opciones</span></li>
      }
    </ul>
  }
</div>
