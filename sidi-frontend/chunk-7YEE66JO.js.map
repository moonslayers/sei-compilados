<div class="d-flex flex-column mt-3">
    <!-- Progress bar section -->
    <div class="w-100 mb-3">
        <p class="mb-1 text-muted small">Barra de progreso</p>
        <div class="progress w-100">
            <div class="progress-bar" role="progressbar" [style.width.%]="sectionProgress"
                [attr.aria-valuenow]="sectionProgress" aria-valuemin="0" aria-valuemax="100">
                {{ sectionProgress | number:'1.0-0' }}%
            </div>
        </div>
    </div>
    <!-- Buttons section -->
    <div class="d-flex justify-content-end w-100">
        @if (currentSection > 0) {
        <button type="button" class="btn btn-secondary me-2" (click)="previous.emit()">
            <i class="bi bi-arrow-left me-2"></i>Previo
        </button>
        }
        @if (currentSection < totalSections - 1) { <button type="button" class="btn btn-primary" (click)="next.emit()"
            [disabled]="isNextButtonDisabled">
            Siguiente<i class="bi bi-arrow-right ms-2"></i>
            </button>
            }
            @if (currentSection === totalSections - 1) {
            <button type="submit" class="btn btn-success" [disabled]="(isFormInvalid && disableSubmitOnInvalid) || isSubmitting"
                (click)="submitForm.emit()">
                <i class="bi bi-check-lg me-2"></i>Enviar
            </button>
            }
    </div>
</div>
