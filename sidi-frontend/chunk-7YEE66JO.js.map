<div class="step-wizard p-3">
    @for (section of sections; track i; let i = $index) {
        <div class="step" [class.active]="i === currentSection" [class.completed]="i < currentSection">
            <div class="step-icon">{{ i + 1 }}</div>
            <div class="step-label">{{ sections[i][0].title }}</div>
        </div>
    }
</div>
