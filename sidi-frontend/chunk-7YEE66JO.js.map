<div class="d-flex flex-wrap gap-1 pt-2">
  @for (option of options; track option) {
    <div 
      class="badge rounded-pill p-2 d-flex align-items-center justify-content-center"
      [class.bg-primary]="isSelected(option)"
      [class.text-white]="isSelected(option)"
      [class.bg-light]="!isSelected(option)"
      [class.text-dark]="!isSelected(option)"
      (click)="toggleSelection(option)"
      (keydown.enter)="toggleSelection(option)"
      tabindex="0"
      style="cursor: pointer;"
    >
      <span class="me-2">{{ option }}</span>
      <button type-="button" class="btn-close"
              [class.btn-close-white]="isSelected(option)"
              [class.invisible]="!isSelected(option)"
              (click)="toggleSelection(option); $event.stopPropagation();">
        <span class="visually-hidden">Remove {{ option }}</span>
      </button>
    </div>
  }
</div>
